<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Git</title>
    <link rel="stylesheet" href="../styles/main.css">
  </head>
  <body>
    <div class="titlebar-drag fixed top-0 left-0 right-0 z-100 h-[38px]"></div>

    <header
      class="header-region relative z-200 flex items-center gap-3 min-h-[48px] shrink-0 px-4 pt-2.5 pb-2.5 pl-[80px]"
    >
      <div class="no-drag flex items-center gap-2">
        <div id="project-selector" class="relative"></div>
        <div id="branch-selector" class="relative"></div>
      </div>
    </header>

    <main class="flex flex-1 min-h-0 border-t border-border">
      <div class="flex flex-col min-h-0 w-[350px] min-w-[280px] border-r border-border shrink-0" id="commit-list-panel">
        <div class="flex items-center justify-between px-3 py-2 border-b border-border shrink-0">
          <div class="flex items-center gap-1.5">
            <button
              type="button"
              class="text-xs font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded-sm border-none cursor-pointer transition-all duration-150 bg-transparent text-text-secondary"
              id="local-changes-btn"
              title="View working copy changes"
            >
              Working Copy
            </button>
            <span class="text-text-muted text-[10px]">/</span>
            <button
              type="button"
              class="text-xs font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded-sm border-none cursor-pointer transition-all duration-150 bg-accent/15 text-accent"
              id="commits-btn"
              title="View commit history"
            >
              History
            </button>
          </div>
          <span class="text-[11px] text-text-muted tabular-nums" id="commit-count"></span>
        </div>
        <div class="flex-1 overflow-y-auto min-h-0" id="commit-list"></div>
        <div class="hidden flex-1 overflow-y-auto min-h-0" id="local-changes-list"></div>
        <div class="hidden px-3 py-2 border-t border-border shrink-0" id="load-more-container">
          <button
            type="button"
            class="block w-full py-1.5 border-none rounded-sm bg-bg-card text-text-secondary text-xs font-medium cursor-pointer transition-all duration-150 font-[inherit] hover:bg-bg-card-hover hover:text-text-primary"
            id="load-more-btn"
          >
            Load more
          </button>
        </div>
      </div>

      <div class="flex flex-col min-h-0 w-[280px] min-w-[220px] border-r border-border shrink-0" id="file-tree-panel">
        <div class="flex items-center justify-between px-3 py-2 border-b border-border shrink-0">
          <span class="text-xs font-semibold text-text-secondary uppercase tracking-wider">Changed Files</span>
          <div class="flex gap-0.5">
            <button
              type="button"
              class="flex items-center justify-center w-[26px] h-[26px] border-none rounded-[4px] bg-accent/15 text-accent cursor-pointer transition-all duration-150"
              id="tree-view-btn"
              title="Tree view"
            >
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path
                  d="M2 2h3v3H2V2zm0 4.5h3v3H2v-3zm0 4.5h3v3H2V11zm5-9h5v3H7V2zm0 4.5h5v3H7v-3zm0 4.5h5v3H7V11z"
                  fill="currentColor"
                  opacity="0.7"
                />
              </svg>
            </button>
            <button
              type="button"
              class="flex items-center justify-center w-[26px] h-[26px] border-none rounded-[4px] bg-transparent text-text-muted cursor-pointer transition-all duration-150 hover:bg-white/6 hover:text-text-secondary"
              id="list-view-btn"
              title="List view"
            >
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path
                  d="M2 3h10v1.5H2V3zm0 3.25h10v1.5H2v-1.5zm0 3.25h10V11H2V9.5z"
                  fill="currentColor"
                  opacity="0.7"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto min-h-0" id="file-tree"></div>
        <div class="hidden border-t border-border p-3 shrink-0 max-h-[200px] overflow-y-auto" id="commit-details"></div>
      </div>

      <div
        class="w-1 cursor-col-resize bg-transparent hover:bg-accent/30 transition-colors shrink-0"
        id="resize-handle"
      ></div>

      <div class="flex flex-col min-h-0 flex-1 min-w-0" id="diff-viewer-panel">
        <div
          class="hidden flex items-center gap-3 px-3 py-2 border-b border-border shrink-0 text-[13px]"
          id="diff-header"
        ></div>
        <div class="flex-1 flex min-h-0 overflow-hidden" id="diff-body">
          <div class="flex-1 flex items-center justify-center h-full text-text-muted text-sm">
            Select a file to view diff
          </div>
        </div>
      </div>
    </main>

    <!-- Command Palette -->
    <div
      class="hidden fixed inset-0 bg-black/40 flex items-start justify-center z-400 pt-[15vh]"
      id="command-palette-overlay"
    >
      <div
        class="bg-bg-secondary border border-border rounded w-[560px] flex flex-col shadow-[0_16px_48px_rgba(0,0,0,0.5)] max-h-[60vh]"
      >
        <div class="px-3 py-2.5 border-b border-border shrink-0">
          <input
            type="text"
            class="w-full bg-transparent text-sm text-text-primary outline-none placeholder:text-text-muted"
            id="command-palette-input"
            placeholder="Search projects, branches, commits, files..."
          >
        </div>
        <div class="flex-1 overflow-y-auto min-h-0 py-1" id="command-palette-results"></div>
      </div>
    </div>

    <!-- File Search -->
    <div
      class="hidden fixed inset-0 bg-black/40 flex items-start justify-center z-400 pt-[15vh]"
      id="file-search-overlay"
    >
      <div
        class="bg-bg-secondary border border-border rounded w-[480px] flex flex-col shadow-[0_16px_48px_rgba(0,0,0,0.5)] max-h-[60vh]"
      >
        <div class="px-3 py-2.5 border-b border-border shrink-0">
          <input
            type="text"
            class="w-full bg-transparent text-sm text-text-primary outline-none placeholder:text-text-muted"
            id="file-search-input"
            placeholder="Search files in commit..."
          >
        </div>
        <div class="flex-1 overflow-y-auto min-h-0 py-1" id="file-search-results"></div>
      </div>
    </div>

    <!-- Context Menu -->
    <div
      class="hidden fixed min-w-[160px] bg-bg-secondary border border-border rounded-sm shadow-[0_8px_24px_rgba(0,0,0,0.4)] z-500 py-1"
      id="context-menu"
    ></div>

    <!-- Squash Dialog -->
    <div
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-400 backdrop-blur-[4px]"
      id="squash-overlay"
    >
      <div
        class="bg-bg-secondary border border-border rounded w-[520px] max-h-[70vh] flex flex-col shadow-[0_16px_48px_rgba(0,0,0,0.4)]"
      >
        <div class="flex items-center justify-between px-5 py-4 border-b border-border shrink-0">
          <h2 class="text-[15px] font-semibold text-text-primary" id="squash-title">Squash commits</h2>
          <button
            type="button"
            class="w-7 h-7 flex items-center justify-center border-none bg-transparent text-text-secondary text-xl cursor-pointer rounded-sm transition-all duration-150 leading-none hover:bg-white/8 hover:text-text-primary"
            id="squash-close"
          >
            &times;
          </button>
        </div>
        <div class="px-5 py-4 flex-1 min-h-0">
          <textarea
            class="w-full min-h-[200px] px-3 py-2.5 border border-border rounded-sm bg-bg-primary text-text-primary font-mono text-[13px] leading-relaxed resize-y outline-none focus:border-accent"
            id="squash-message"
            placeholder="Enter commit message..."
          ></textarea>
        </div>
        <div class="flex justify-end gap-2 px-5 py-3 border-t border-border shrink-0">
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-bg-card text-text-primary hover:bg-bg-card-hover"
            id="squash-cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-accent text-white hover:bg-accent-hover"
            id="squash-confirm"
          >
            Squash
          </button>
        </div>
      </div>
    </div>

    <!-- Add Project Dialog -->
    <div
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-400 backdrop-blur-[4px]"
      id="add-project-overlay"
    >
      <div
        class="bg-bg-secondary border border-border rounded w-[420px] flex flex-col shadow-[0_16px_48px_rgba(0,0,0,0.4)]"
      >
        <div class="flex items-center justify-between px-5 py-4 border-b border-border shrink-0">
          <h2 class="text-[15px] font-semibold text-text-primary">Add Project</h2>
          <button
            type="button"
            class="w-7 h-7 flex items-center justify-center border-none bg-transparent text-text-secondary text-xl cursor-pointer rounded-sm transition-all duration-150 leading-none hover:bg-white/8 hover:text-text-primary"
            id="add-project-close"
          >
            &times;
          </button>
        </div>
        <div class="px-5 py-4 flex flex-col gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium text-text-secondary" for="add-project-path">Folder</label>
            <div class="flex gap-2">
              <input
                type="text"
                class="flex-1 px-3 py-2 border border-border rounded-sm bg-bg-primary text-text-primary text-[13px] outline-none focus:border-accent"
                id="add-project-path"
                readonly
                placeholder="Select a folder..."
              >
              <button
                type="button"
                class="px-3 py-2 border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-bg-card text-text-primary hover:bg-bg-card-hover"
                id="add-project-browse"
              >
                Browse
              </button>
            </div>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium text-text-secondary" for="add-project-name">Name (optional)</label>
            <input
              type="text"
              class="w-full px-3 py-2 border border-border rounded-sm bg-bg-primary text-text-primary text-[13px] outline-none focus:border-accent"
              id="add-project-name"
              placeholder="Uses folder name if empty"
            >
          </div>
        </div>
        <div class="flex justify-end gap-2 px-5 py-3 border-t border-border shrink-0">
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-bg-card text-text-primary hover:bg-bg-card-hover"
            id="add-project-cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-accent text-white hover:bg-accent-hover disabled:opacity-50 disabled:cursor-default"
            id="add-project-confirm"
            disabled
          >
            Add
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Dialog -->
    <div
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-400 backdrop-blur-[4px]"
      id="settings-overlay"
    >
      <div
        class="bg-bg-secondary border border-border rounded w-[420px] flex flex-col shadow-[0_16px_48px_rgba(0,0,0,0.4)]"
      >
        <div class="flex items-center justify-between px-5 py-4 border-b border-border shrink-0">
          <h2 class="text-[15px] font-semibold text-text-primary">Settings</h2>
          <button
            type="button"
            class="w-7 h-7 flex items-center justify-center border-none bg-transparent text-text-secondary text-xl cursor-pointer rounded-sm transition-all duration-150 leading-none hover:bg-white/8 hover:text-text-primary"
            id="settings-close"
          >
            &times;
          </button>
        </div>
        <div class="px-5 py-4 flex flex-col gap-4">
          <div class="flex items-center justify-between">
            <div class="flex flex-col gap-0.5">
              <span class="text-[13px] font-medium text-text-primary">Drop mode</span>
              <span class="text-[11px] text-text-secondary">How commits are removed when dropped</span>
            </div>
            <select
              class="settings-select pl-3 pr-8 py-1.5 border border-border rounded-sm bg-bg-primary text-text-primary text-[13px] outline-none focus:border-accent cursor-pointer appearance-none"
              id="settings-drop-mode"
            >
              <option value="hard">Hard (discard changes)</option>
              <option value="soft">Soft (keep changes)</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex flex-col gap-0.5">
              <span class="text-[13px] font-medium text-text-primary">Diff view</span>
              <span class="text-[11px] text-text-secondary">How file diffs are displayed</span>
            </div>
            <select
              class="settings-select pl-3 pr-8 py-1.5 border border-border rounded-sm bg-bg-primary text-text-primary text-[13px] outline-none focus:border-accent cursor-pointer appearance-none"
              id="settings-diff-view-mode"
            >
              <option value="full">Full file</option>
              <option value="minimal">Minimal (changes only)</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex flex-col gap-0.5">
              <span class="text-[13px] font-medium text-text-primary">Commit mode</span>
              <span class="text-[11px] text-text-secondary">New commit or amend the last commit</span>
            </div>
            <select
              class="settings-select pl-3 pr-8 py-1.5 border border-border rounded-sm bg-bg-primary text-text-primary text-[13px] outline-none focus:border-accent cursor-pointer appearance-none"
              id="settings-commit-mode"
            >
              <option value="commit">New Commit</option>
              <option value="amend">Amend Last Commit</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end px-5 py-3 border-t border-border shrink-0">
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-accent text-white hover:bg-accent-hover"
            id="settings-done"
          >
            Done
          </button>
        </div>
      </div>
    </div>

    <!-- Checkout Dialog -->
    <div
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-400 backdrop-blur-[4px]"
      id="checkout-overlay"
    >
      <div
        class="bg-bg-secondary border border-border rounded w-[480px] max-h-[70vh] flex flex-col shadow-[0_16px_48px_rgba(0,0,0,0.4)]"
      >
        <div class="flex items-center justify-between px-5 py-4 border-b border-border shrink-0">
          <h2 class="text-[15px] font-semibold text-text-primary" id="checkout-title">Uncommitted changes</h2>
          <button
            type="button"
            class="w-7 h-7 flex items-center justify-center border-none bg-transparent text-text-secondary text-xl cursor-pointer rounded-sm transition-all duration-150 leading-none hover:bg-white/8 hover:text-text-primary"
            id="checkout-close"
          >
            &times;
          </button>
        </div>
        <div class="px-5 py-3 flex-1 min-h-0 overflow-y-auto">
          <p class="text-[13px] text-text-secondary mb-3">The following files have uncommitted changes:</p>
          <div class="flex flex-col gap-0.5" id="checkout-file-list"></div>
        </div>
        <div class="flex justify-end gap-2 px-5 py-3 border-t border-border shrink-0">
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-bg-card text-text-primary hover:bg-bg-card-hover"
            id="checkout-cancel"
          >
            Don't switch
          </button>
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-red/20 text-red hover:bg-red/30"
            id="checkout-discard"
          >
            Discard changes
          </button>
          <button
            type="button"
            class="px-4 py-[7px] border-none rounded-sm text-[13px] font-medium cursor-pointer transition-all duration-150 font-[inherit] bg-accent text-white hover:bg-accent-hover"
            id="checkout-stash"
          >
            Stash and switch
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/app.ts"></script>
  </body>
</html>
